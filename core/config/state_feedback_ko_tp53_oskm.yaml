# State-feedback ISP — mixed chain KO-B (docs/state_feedback_deletion_counterfactual.md)
# TP53 KO -> KLF4 -> MYC -> SOX2 -> POU5F1 (OE), somatic -> pluripotent,
# teacher = observed pluripotent ranks (as in the OSKM runs).
# Start cells: every somatic cell with TP53 detected (116 of 3,000); the placebo strata
# are built from these cells. Random chains replace the KO slot only, so the estimate
# is the TP53 KO on top of OSKM with the same number of feedback events (K2).

paths:
  dataset: data/bbrcv3/tokenize_human_native/tokenized_dataset/GSE147564_ft6k_qc_human_native_0.dataset
  geneformer_model: data/bbrcv3/v2_ft_human_native/all_run1
  output_root: data/bbrcv3/runs/state_feedback_ko
  output_date_subdir: true
  output_time_subdir: true

species:
  model_organism: human
  model: human_geneformer
  human_variant: v2_104m
  ortholog_policy: one2one

perturbation:
  state_key: disease
  start_state: somatic
  end_state: pluripotent
  alt_states: []

model:
  type: CellClassifier
  num_classes: 2

isp:
  # Upper bound only: require_detected keeps the 116 TP53-detected cells. Also the
  # number of cells per state for the centroids, as in the n=300 OSKM run.
  max_ncells: 300
  emb_layer: 0

state_feedback:
  steps:
    - name: TP53
      type: delete
      genes: [TP53]
    - name: KLF4
      type: overexpress
      genes: [KLF4]
    - name: MYC
      type: overexpress
      genes: [MYC]
    - name: SOX2
      type: overexpress
      genes: [SOX2]
    - name: POU5F1
      type: overexpress
      genes: [POU5F1]

  require_detected: [TP53]

  observed_state: pluripotent
  observed_max_ncells: 3000
  min_detection_count: 5

  pin_overexpressed: true
  ctrl_reference: start
  hysteresis: 0.0
  alpha: 1.0
  baseline_max_shift: 0.1

  stability:
    seeds: [0, 1, 2]
    idle_events: 0
    n_random_chains: 30
    random_seeds: [0]
    # 1-based; the other steps keep OSKM.
    random_steps: [1]
    min_stratum: 50
    topk: [100, 500, 1000]

  placebo_contrast:
    enabled: true
    n_estimation: 20
    estimation_draw_seed: 1

  decoder:
    train_max_ncells: 200
    max_genes_per_cell: 256
    val_fraction: 0.2
    epochs: 20
    lr: 0.001
    batch_size: 4096
    lam_huber: 1.0
    lam_pair: 0.5
    lam_smooth: 0.01
    max_shift_grid: [0.05, 0.1, 0.2, 0.3, 0.5]
    seed: 0

runtime:
  nproc: 1
  forward_batch_size: auto
