# State-feedback ISP — Phase 1-2 (baselines + linear Delta-rank decoder)
#
# GENERIC BY DESIGN. Nothing below is specific to reprogramming factors:
#   - `state_feedback.steps` is any list of steps, each with `type: overexpress|knockdown`
#     and any gene symbols / Ensembl IDs present in your token dictionary.
#   - `perturbation.state_key / start_state / end_state` are whatever labels your
#     fine-tuned classifier was trained on.
#   - `state_feedback.observed_state` names the state whose *observed* ranks supply
#     the decoder's teacher signal (and the oracle ceiling). It defaults to `end_state`.
# The values here are the paper's OSKM -> pluripotency case only as a worked example.
# To reuse: swap dataset / model / states / steps. No code changes needed.

paths:
  dataset: data/bbrcv3/tokenize_human_native/tokenized_dataset/GSE147564_ft6k_qc_human_native_0.dataset
  geneformer_model: data/bbrcv3/v2_ft_human_native/all_run1
  output_root: data/bbrcv3/runs/state_feedback_phase12
  output_date_subdir: true
  output_time_subdir: true

species:
  model_organism: human
  model: human_geneformer
  human_variant: v2_104m
  ortholog_policy: one2one

perturbation:
  state_key: disease
  start_state: somatic
  end_state: pluripotent
  alt_states: []

model:
  type: CellClassifier
  num_classes: 2

isp:
  max_ncells: 300
  emb_layer: 0

state_feedback:
  # Any number of steps, any genes, overexpress or knockdown
  # (a legacy top-level `sequential.steps` block is still read).
  steps:
    - name: KLF4
      type: overexpress
      genes: [KLF4]
    - name: MYC
      type: overexpress
      genes: [MYC]
    - name: SOX2
      type: overexpress
      genes: [SOX2]
    - name: POU5F1
      type: overexpress
      genes: [POU5F1]

  # Conditions compared in one run. `oracle` is a ceiling (observed ranks pasted in),
  # `null_feedback` is the zero-perturbation guardrail.
  conditions:
    - ordered_rank_edit
    - norm
    - delta_mlm
    - linear_deltarank
    - oracle
    - null_feedback

  # Teacher / ceiling source.
  observed_state: pluripotent
  observed_max_ncells: 3000
  min_detection_count: 5

  # Where feedback is injected in the chain.
  feedback_after_step: 1
  feedback_every_step: false
  ctrl_reference: start      # start | previous

  # Multi-step guardrails, used only with `feedback_every_step: true`
  # (feedback after every step from `feedback_after_step` on, except the last).
  # Per cell: a rerank that returns to the encoding of two events ago is a 2-cycle;
  # it is rejected and the cell's feedback stops. A feedback event is "small" when
  # Spearman(before, after) > converge_spearman or top-`converge_topk` Jaccard
  # > converge_jaccard (only for cells with more than converge_topk genes, since the
  # gene set is fixed); after `converge_patience` small events in a row the cell's
  # feedback stops. `max_feedback_events` caps feedback events per chain.
  # Per-cell halts: <condition>/feedback_guard.csv; counts in run_manifest.json.
  multi_step:
    max_feedback_events: 5
    converge_spearman: 0.995
    converge_topk: 1000
    converge_jaccard: 0.99
    converge_patience: 2
    halt_on_cycle: true

  # Guardrails. `hysteresis` quantizes priorities onto an epsilon grid before a
  # stable sort, so near-ties keep their original order (no jitter swaps).
  hysteresis: 0.0
  # Phase 1 parameter-free baselines only (the decoder uses decoder.max_shift_grid).
  alpha: 1.0
  baseline_max_shift: 0.1

  # Direction-fidelity evaluation: scores every method against the observed Delta-rank
  # on the held-out gene split. This is the PRIMARY Phase 2 axis. The endpoint shift
  # cannot separate "permuted in the right direction" from "encoding was disturbed",
  # and the oracle carries endpoint leakage, so neither settles the gate alone.
  eval:
    # full_chain  = features from all steps applied (matches decoder training)
    # feedback_point = features at the step where feedback is actually injected
    perturbation: full_chain
    max_genes_per_cell: 512
    topk: [50, 100, 500]
    n_boot: 1000       # cell-level bootstrap for the CI on rho_linear - rho_baseline
    n_perm: 10000      # paired sign-flip permutation test on per-cell rho differences
    seed: 0

  # Perturbation-specificity control (off by default; `--specificity` forces it on).
  # The same decoder is fed Delta-h from other perturbations. If its signal beyond
  # base rank (partial Spearman given base rank) came from the scored genes alone,
  # every perturbation would score alike. Conditions: `configured` (the steps above,
  # cumulative), each named set (applied at once), and `n_random` draws of
  # `random_size` teacher genes. For `random_type: delete`, set
  # `random_match_detection` to a gene so random targets are detected in 0.5-2x as
  # many start cells (deleting an undetected gene changes nothing).
  specificity:
    enabled: false
    sets:
      OSKM: {type: overexpress, genes: [POU5F1, SOX2, KLF4, MYC]}
      3F_OSN: {type: overexpress, genes: [POU5F1, SOX2, NANOG]}
      7F: {type: overexpress, genes: [NANOG, POU5F1, SOX2, ESRRB, LIN28A, DPPA4, TERT]}
    n_random: 30
    random_size: 4
    random_type: overexpress   # overexpress | delete | knockdown
    random_match_detection: null
    n_boot: 1000

  decoder:
    train_max_ncells: 200
    max_genes_per_cell: 256
    val_fraction: 0.2
    epochs: 20
    lr: 0.001
    batch_size: 4096
    lam_huber: 1.0
    lam_pair: 0.5
    lam_identity: 1.0
    lam_smooth: 0.01
    # Selected by held-out-gene val Spearman. Widened past 0.2 because val
    # Spearman was still rising at the old upper bound; large values let the
    # decoder move a gene most of the way across the encoding, so watch the
    # null-drift and displacement columns when a big shift wins.
    max_shift_grid: [0.05, 0.1, 0.2, 0.3, 0.5]
    seed: 0

runtime:
  nproc: 1
  forward_batch_size: auto
