# =============================================================================
# ISP UMAP Generator Configuration (standalone service)
# Also auto-invoked by run_isp.py / pipeline when perturbation.genes_to_perturb is set.
# Path: /app/core/config/isp_umap.yaml
# =============================================================================

paths:
  # Path to tokenized HuggingFace dataset
  dataset: /app/data/smoke_mouse/tokenized_dataset/smoke_mouse_0.dataset
  geneformer_model: /app/models/mouse-Geneformer/

umap:
  # Random seed for robust/reproducible UMAP plotting (and PCA when enabled)
  seed: 42
  # UMAP parameters
  n_neighbors: 15
  min_dist: 0.1
  # 0 = direct UMAP on embeddings (default); 50 = Fig.2/3/4-style PCA(50)→UMAP
  pca_components: 0
  # Draw Start -> Perturbed arrows on the UMAP scatter (navy; white L-axes)
  show_trajectory_arrows: true
  # How many trajectories to draw when show_trajectory_arrows is true
  num_trajectory_arrows: 100
  # Maximum cells to extract per state to prevent memory limits.
  # Cap is stratified by sample_key (proportional, ≥1 cell per sample when possible)
  # then shuffled; not the first N cells of the tokenized dataset.
  max_cells_per_state: 2000
  sample_key: sample_id

perturbation:
  # One or more genes perturbed together (group KD or OE). Symbols or Ensembl IDs.
  genes_to_perturb:
    - Igfbp2
  # Legacy single-gene key (still accepted): gene_to_perturb: Igfbp2
  # Perturbation type: delete (KD) or overexpress (length-preserving OE, Fig.3-style)
  type: delete
  
  # Dataset column specifying the cell condition
  state_key: disease
  # The starting cell condition (the one being perturbed)
  start_state: AD
  # The goal/target condition (the one to compare against)
  end_state: WT

runtime:
  # Number of labels output by the finetuned Sequence Classification model
  num_classes: 2
  # Batch size for dataset mapping processes
  batch_size: 100

# Optional post-UMAP cluster / cell-type analysis (default OFF).
# When enabled, writes cluster_coexpr_analysis/ under the UMAP run dir:
#   umap_joint_l2_cluster_celltype.png, l2_by_coarse_celltype.png,
#   l2_mean_by_coarse_celltype.png, per_cell_cluster_l2_celltype.csv, joint_umap_coords.npy
postprocess:
  enabled: false
  # Integer (>=2) or "auto" (silhouette over k=2..15 on start embeddings).
  n_clusters: 4
  celltype_prediction: true
  # auto = use pre-ISP platform cell_type when celltype_annotator=isp_expression*;
  # true = trust any dataset cell_type; false = marker scoring only.
  prefer_metadata_celltype: auto
  # Weight marker hits by Geneformer rank position (higher expression earlier).
  celltype_rank_weights: true
  # Subtract negative-marker scores (sharpen SMC vs endo/microglia etc.).
  celltype_negative_markers: true
  celltype_negative_weight: 0.55
  # Also writes umap_celltype_trajectories.png + celltype_shift_summary.csv
