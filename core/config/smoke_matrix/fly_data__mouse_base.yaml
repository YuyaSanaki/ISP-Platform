data:
  input_type: single-cell
  input_dir: /app/data/smoke_fly
  output_prefix: smoke
paths:
  output_root: /app/output/smoke_matrix/fly_data__mouse_base
species:
  model_organism: drosophila
  model: mouse_geneformer
  mouse_variant: base
runtime:
  nproc: 2
  max_cells: 5000
  forward_batch_size: 8
perturbation:
  type: delete
  state_key: disease
  start_state: AD
  end_state: WT
  genes_to_perturb:
  - FBgn0036990
stages:
  tokenize:
    report_conversion: true
  finetune:
    training:
      epochs: 1
      warmup_ratio: 0.05
      batch_size: 4
      eval_batch_size: 1
      num_runs: 1
    runtime:
      dataloader_num_workers: 0
    metadata:
      add_columns:
        organ_major: brain
    umap:
      enabled: false
  isp:
    runtime:
      forward_batch_size: 8
    umap:
      enabled: false
